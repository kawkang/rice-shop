<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>หลังร้าน · ข้าวแกง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f7f7f8; --surface:#ffffff; --subtle:#f2f2f4; --fg:#111114; --fg2:#3f3f46; --muted:#8a8a94; --line:#e7e7ea; --line2:#d9d9de;
    --ok:#16a34a; --ok-soft:#e9f8ee; --bad:#dc2626; --bad-soft:#fdecec;
    --plate:#2563eb; --plate-soft:#edf3ff; --bowl:#b45309; --bowl-soft:#fff5e6;
    --todo:#f59e0b; --todo-soft:#fff7e6;
    --shadow:0 1px 2px rgba(16,16,20,.04),0 1px 1px rgba(16,16,20,.03);
    --num:"Inter","IBM Plex Sans Thai",system-ui,sans-serif;
    --body:"IBM Plex Sans Thai","Inter",system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0c0c0e; --surface:#151518; --subtle:#1c1c20; --fg:#f4f4f5; --fg2:#d4d4d8; --muted:#8b8b95; --line:#26262b; --line2:#34343a;
      --ok:#22c55e; --ok-soft:rgba(34,197,94,.12); --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
      --plate:#7aa2ff; --plate-soft:rgba(122,162,255,.12); --bowl:#f5b453; --bowl-soft:rgba(245,180,83,.12);
      --todo:#f59e0b; --todo-soft:rgba(245,158,11,.12);
      --shadow:none; color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;line-height:1.3;font-weight:600}
  button{font:inherit;color:inherit}
  .num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .muted{color:var(--muted);font-size:13px}
  .lbl{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
  [hidden]{display:none!important}

  /* ---------- top bar ---------- */
  header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
  header.top .in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
  .brand h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:12px;color:var(--muted);line-height:1.2}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:5px 12px 5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);position:relative;flex:none}
  .status.open .dot{background:var(--ok)}
  .status.open .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--ok);opacity:.35;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  .status.closed .dot{background:var(--bad)}
  @keyframes ping{75%,100%{transform:scale(2);opacity:0}}
  .grow{flex:1}
  .sync{font-size:12px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:14px;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--fg);background:var(--fg);color:var(--bg);transition:background .15s,border-color .15s,color .15s}
  .btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line2)}
  .btn.ghost:hover{background:var(--subtle)}
  .btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
  .btn.text{background:none;border-color:transparent;color:var(--muted);padding:5px 8px}
  .btn.text:hover{color:var(--bad);background:var(--bad-soft)}
  .btn.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
  .btn:focus-visible,input:focus-visible,.sw:focus-visible,.seg button:focus-visible{outline:2px solid var(--plate);outline-offset:2px}

  /* ---------- layout ---------- */
  .wrap{max-width:1240px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
  .col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .card-h h2{font-size:14px}
  .card-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .kpi+.kpi{border-left:1px solid var(--line)}
  .kpi b{font-size:30px;font-weight:600;line-height:1.05}
  .kpi b small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px}

  /* ---------- queue ---------- */
  .seg{display:inline-flex;padding:3px;background:var(--subtle);border-radius:10px;gap:2px}
  .seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg .c{font-family:var(--num);font-size:12px;color:var(--muted)}
  .count{font-family:var(--num);font-size:12px;font-weight:600;background:var(--subtle);color:var(--fg2);border-radius:6px;padding:1px 7px;margin-left:6px}
  #orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:14px}
  .tk{position:relative;border:2px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
  .tk.todo{border-color:var(--todo)}
  .tk.todo.new{box-shadow:0 0 0 4px var(--todo-soft)}
  .tk.done{border-color:var(--ok)}
  .tk.done .tk-q{color:var(--ok)}
  .tk.done .tk-f{background:var(--ok-soft)}
  .chip.todo{background:var(--todo-soft);color:var(--bowl)}
  .chip.done{background:var(--ok);color:#fff}
  .btn.ready{padding:9px 20px;font-size:16px;font-weight:600;border-radius:10px;background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.ready:hover{filter:brightness(1.05)}
  .btn.undo{background:var(--surface);color:var(--fg2);border-color:var(--line2)}
  .tk-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 14px 10px}
  .tk-q{font-family:var(--num);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em}
  .tk-meta{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .tk-time{font-family:var(--num);font-size:13px;color:var(--muted)}
  .chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:6px}
  .chip.new{background:var(--bad);color:#fff}
  .chip.x{background:var(--subtle);color:var(--muted)}
  .tk-items{display:flex;flex-direction:column;padding:0 14px}
  .row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
  .row .no{width:22px;height:22px;border-radius:6px;background:var(--subtle);color:var(--fg2);font-family:var(--num);font-size:12px;font-weight:600;display:grid;place-items:center}
  .row .it{font-size:18px;font-weight:500;line-height:1.4;min-width:0}
  .row .rt{display:flex;align-items:center;gap:8px}
  .row .pr{font-family:var(--num);font-size:13px;color:var(--muted);min-width:34px;text-align:right}
  .pk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px 3px 7px;border-radius:6px;white-space:nowrap}
  .pk::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pk.plate{background:var(--plate-soft);color:var(--plate)}
  .pk.bowl{background:var(--bowl-soft);color:var(--bowl)}
  .tk .sum{white-space:pre-line;font-size:17px;padding:10px 0;border-top:1px dashed var(--line)}
  .tk .note{margin:2px 14px 8px;font-size:13px;color:var(--bowl);background:var(--bowl-soft);border-radius:8px;padding:6px 10px}
  .tk-f{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--subtle);border-top:1px solid var(--line)}
  .tk-f .fl{display:flex;flex-direction:column;min-width:0;line-height:1.3}
  .tk-f .who{font-size:13px;color:var(--fg2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tk-f .tot{font-family:var(--num);font-weight:600;font-size:16px;white-space:nowrap}
  .tk-f .fa{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
  .tk.cancelled{opacity:.55}
  .tk.cancelled .tk-q,.tk.cancelled .it,.tk.cancelled .sum{text-decoration:line-through}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-size:14px}

  /* ---------- side ---------- */
  .swrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .swrow b{font-weight:600;font-size:14px;display:block}
  .sw{flex:none;width:44px;height:26px;border-radius:999px;border:0;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;padding:0}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
  .sw[aria-checked="true"]{background:var(--ok)}
  .sw[aria-checked="true"]::after{transform:translateX(18px)}
  .sw.sm{width:36px;height:22px}
  .sw.sm::after{width:16px;height:16px}
  .sw.sm[aria-checked="true"]::after{transform:translateX(14px)}
  .times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{display:flex;flex-direction:column;gap:4px}
  input[type=text],input[type=password],input[type=time]{font:inherit;font-size:14px;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--fg);min-width:0;width:100%}
  input[type=time]{font-family:var(--num)}
  .divider{height:1px;background:var(--line);margin:2px 0}
  .prep .ln{display:grid;grid-template-columns:minmax(0,1fr) 64px 28px;gap:10px;align-items:center;padding:5px 0}
  .prep .name{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:6px;border-radius:99px;background:var(--subtle);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--fg);border-radius:99px}
  .prep .n{font-family:var(--num);font-weight:600;font-size:15px;text-align:right}
  .packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
  .pbox b{font-family:var(--num);font-size:20px;font-weight:600}
  .menu .ln{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .menu .ln:first-child{border-top:0}
  .menu .name{flex:1;font-size:14px;min-width:0}
  .menu .ln.out .name{color:var(--muted);text-decoration:line-through}
  .menu .seg{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .menu .seg button{justify-content:center;padding:7px 10px}
  .dayinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
  .dayinfo b{color:var(--fg);font-weight:600}
  .hint{display:flex;gap:8px;align-items:flex-start;background:var(--plate-soft);color:var(--plate);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45}
  .badge-new{font-size:11px;font-weight:600;background:var(--ok);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
  .icon{width:28px;height:28px;border:0;background:none;border-radius:7px;color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1}
  .icon:hover{background:var(--bad-soft);color:var(--bad)}
  .addrow{display:flex;gap:6px}
  .addrow input{flex:1}

  /* ---------- toast ---------- */
  .banner{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:14px;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 20px 12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.25);font-size:15px;font-weight:500;white-space:nowrap}
  .banner .tag{background:var(--bad);color:#fff;font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px}
  .banner .q{font-family:var(--num);font-size:30px;font-weight:700;line-height:1}
  .banner .info{opacity:.7;font-size:14px}
  @keyframes drop{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .banner{animation:drop .3s ease-out}
  @media (prefers-reduced-motion:reduce){.banner,.status.open .dot::after{animation:none}}

  /* ---------- login ---------- */
  .login{max-width:360px;margin:16vh auto;padding:24px;display:flex;flex-direction:column;gap:12px}
  .login h1{font-size:18px}
  .err{color:var(--bad);font-size:13px}

  @media (max-width:900px){
    .wrap{grid-template-columns:minmax(0,1fr);padding:16px;gap:16px}
    .col{gap:16px}
    header.top .in{padding:10px 16px;gap:10px}
    .brand .sub,.sync,.grow{display:none}
    .status{margin-left:auto}
    #startBtn{flex-basis:100%}
    .banner{top:110px}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .kpi:nth-child(3){border-left:0}
    .kpi:nth-child(n+3){border-top:1px solid var(--line)}
    #orders{grid-template-columns:minmax(0,1fr);padding:12px}
  }
</style>
</head>
<body>

<!-- Login -->
<div class="login card" id="loginBox" hidden>
  <div class="logo">ข</div>
  <h1>เข้าสู่หลังร้าน</h1>
  <label for="keyInput" class="lbl">รหัสแอดมิน</label>
  <input type="password" id="keyInput" autocomplete="current-password">
  <button class="btn" id="loginBtn">เข้าสู่ระบบ</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- App -->
<div id="appBox" hidden>
  <header class="top"><div class="in">
    <div class="brand">
      <div class="logo">ข</div>
      <div><h1 id="shopName">หลังร้าน</h1><div class="sub">หลังร้าน</div></div>
    </div>
    <span class="status" id="openPill"><span class="dot"></span><span id="openText">—</span></span>
    <span class="grow"></span>
    <span class="sync num" id="syncInfo">กำลังโหลด…</span>
    <button class="btn" id="startBtn">🔔 เปิดเสียงแจ้งเตือน</button>
  </div></header>

  <div class="banner" id="banner" hidden><span class="tag">ใหม่</span><span class="q" id="bannerQ"></span><span class="info" id="bannerInfo"></span></div>

  <div class="wrap">
    <div class="col">
      <div class="card kpis">
        <div class="kpi"><span class="lbl">ออเดอร์</span><b class="num" id="sOrders">0</b></div>
        <div class="kpi"><span class="lbl">รายการ</span><b class="num" id="sPlates">0</b></div>
        <div class="kpi"><span class="lbl">ยอดขาย</span><b class="num"><span id="sRevenue">0</span><small>฿</small></b></div>
        <div class="kpi"><span class="lbl">เฉลี่ย / ออเดอร์</span><b class="num"><span id="sAvg">0</span><small>฿</small></b></div>
      </div>

      <section class="card">
        <div class="card-h">
          <h2>คิววันนี้<span class="count" id="qCount">0</span></h2>
          <div class="seg" role="group" aria-label="ตัวกรองคิว">
            <button data-filter="waiting" aria-pressed="true">คิว <span class="c" id="cWait">0</span></button>
            <button data-filter="all" aria-pressed="false">ทั้งหมด <span class="c" id="cAll">0</span></button>
          </div>
        </div>
        <div id="orders"><div class="empty">ยังไม่มีออเดอร์</div></div>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <div class="card-h"><h2>สถานะร้าน</h2></div>
        <div class="card-b">
          <div class="swrow">
            <div><b id="openLabel">รับออเดอร์</b><span class="muted" id="closedReason"></span></div>
            <button class="sw" id="toggleOpen" role="switch" aria-checked="false" aria-label="เปิดรับออเดอร์"></button>
          </div>
          <div class="divider"></div>
          <div class="times">
            <div class="field"><label class="lbl" for="openTime">เริ่มรับ</label><input type="time" id="openTime"></div>
            <div class="field"><label class="lbl" for="closeTime">ปิดรับ</label><input type="time" id="closeTime"></div>
          </div>
          <button class="btn ghost sm" id="saveClose">บันทึกเวลา</button>
        </div>
      </section>

      <section class="card prep">
        <div class="card-h"><h2>ต้องเตรียม</h2><span class="muted">จำนวนที่ต้องตัก</span></div>
        <div class="card-b">
          <div id="cook"><div class="muted">—</div></div>
          <div class="packs">
            <div class="pbox"><span class="pk plate">ใส่จาน</span><b id="pPlate">0</b></div>
            <div class="pbox"><span class="pk bowl">ใส่ถ้วย</span><b id="pBowl">0</b></div>
          </div>
        </div>
      </section>

      <section class="card menu">
        <div class="card-h"><h2>เมนู</h2><button class="btn text sm" id="copyLast" style="color:var(--fg2)">ใช้เมนูเมื่อวาน</button></div>
        <div class="card-b">
          <div class="seg" role="group" aria-label="เลือกวันของเมนู">
            <button data-day="today" aria-pressed="true">วันนี้ <span class="c" id="cToday">0</span></button>
            <button data-day="tomorrow" aria-pressed="false">พรุ่งนี้ <span class="c" id="cTomorrow">0</span></button>
          </div>
          <div class="dayinfo"><span id="dayLabel">—</span><span id="dayNote"></span></div>
          <div class="hint" id="tmrHint" hidden><span>🗓️</span><span>เมนูนี้จะขึ้นให้ลูกค้าเห็นเองพรุ่งนี้ ไม่ต้องรอตั้งตอนเที่ยงคืน</span></div>
          <div class="addrow">
            <input type="text" id="newItem" placeholder="เพิ่มกับข้าว เช่น แกงเขียวหวานไก่" maxlength="40">
            <button class="btn" id="addItem">เพิ่ม</button>
          </div>
          <div id="menu"></div>
        </div>
      </section>

      <button class="btn text sm" id="logout" style="align-self:flex-start">ออกจากระบบ</button>
    </div>
  </div>
</div>

<script>
/* ========= ตั้งค่า (แก้บรรทัดนี้) ========= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzeV2BKTBtf2oo3-ehgaQZREoKTUtzRsEWGoQs6w_TgbENirfjxNXXKWnaZmt65moAB/exec';
const POLL_MS = 7000;
/* ========================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = '';
try { KEY = localStorage.getItem('adminKey') || ''; } catch (_) {}
let menuDay = 'today';
let data = null, seenQueue = null, filter = 'waiting', audioCtx = null, wakeLock = null, timer = null, newSet = new Set();

async function getData() {
  const r = await fetch(`${API_URL}?action=admin&key=${encodeURIComponent(KEY)}`);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error);
  return d;
}
async function post(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key: KEY }) });
  const d = await r.json();
  if (!d.ok) throw new Error(d.error);
  return d;
}

/* ---------- login ---------- */
async function tryLogin() {
  try {
    data = await getData();
    try { localStorage.setItem('adminKey', KEY); } catch (_) {}
    $('#loginBox').hidden = true; $('#appBox').hidden = false;
    seenQueue = data.lastQueue;
    render();
    timer = setInterval(poll, POLL_MS);
  } catch (e) {
    $('#appBox').hidden = true; $('#loginBox').hidden = false;
    $('#loginErr').textContent = KEY ? e.message : '';
  }
}
$('#loginBtn').onclick = () => { KEY = $('#keyInput').value.trim(); tryLogin(); };
$('#keyInput').onkeydown = e => { if (e.key === 'Enter') $('#loginBtn').click(); };
$('#logout').onclick = () => { try { localStorage.removeItem('adminKey'); } catch (_) {} location.reload(); };

/* ---------- polling + sound ---------- */
async function poll() {
  try {
    const d = await getData();
    const fresh = d.orders.filter(o => o.queueNum > seenQueue && o.status === 'active');
    data = d;
    if (fresh.length) {
      fresh.forEach(o => newSet.add(o.orderId));
      seenQueue = d.lastQueue;
      const latest = fresh[0];
      $('#bannerQ').textContent = latest.queue;
      $('#bannerInfo').textContent = fresh.length > 1 ? `และอีก ${fresh.length - 1} ออเดอร์` : `${latest.plates.length} รายการ · ${latest.total} ฿`;
      $('#banner').hidden = false;
      ding(fresh.length);
      setTimeout(() => { $('#banner').hidden = true; }, 15000);
      document.title = `(${latest.queue}) ออเดอร์ใหม่`;
      setTimeout(() => { document.title = 'หลังร้าน · ข้าวแกง'; }, 15000);
    }
    render();
  } catch (e) {
    $('#syncInfo').textContent = 'เชื่อมต่อไม่ได้ จะลองใหม่อัตโนมัติ · ' + e.message;
  }
}

function ding(times) {
  if (!audioCtx) return;
  const n = Math.min(times, 3);
  for (let k = 0; k < n; k++) {
    [880, 1175].forEach((f, i) => {
      const t = audioCtx.currentTime + k * 0.6 + i * 0.18;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.4);
    });
  }
}

$('#startBtn').onclick = async () => {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  ding(1);
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
  $('#startBtn').textContent = '🔔 เสียงเปิดอยู่';
  $('#startBtn').classList.add('on');
};
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeLock !== null) {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
  }
});

const TH_DAY = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'], TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function thaiDay(ymd) {
  if (!ymd) return '—';
  const [y, m, dd] = ymd.split('-').map(Number), dt = new Date(y, m - 1, dd);
  return `${TH_DAY[dt.getDay()]} ${dd} ${TH_MON[m - 1]} ${y + 543}`;
}

/* ---------- render ---------- */
function render() {
  const d = data, s = d.settings;
  $('#shopName').textContent = s.shop_name || 'หลังร้าน';
  const isOpen = !d.closedReason;
  $('#openText').textContent = isOpen ? `รับออเดอร์อยู่ · ถึง ${s.close_time} น.` : 'ปิดรับออเดอร์';
  $('#openPill').className = 'status ' + (isOpen ? 'open' : 'closed');
  $('#openLabel').textContent = s.open ? 'เปิดรับออเดอร์' : 'ปิดรับชั่วคราว';
  $('#closedReason').textContent = d.closedReason || `ทุกวัน ${s.open_time || '—'}–${s.close_time} น.`;
  $('#toggleOpen').setAttribute('aria-checked', String(!!s.open));
  if (document.activeElement !== $('#closeTime')) $('#closeTime').value = s.close_time;
  if (document.activeElement !== $('#openTime')) $('#openTime').value = s.open_time || '';
  $('#syncInfo').textContent = `อัปเดต ${new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

  $('#sOrders').textContent = d.stats.orders;
  $('#sPlates').textContent = d.stats.plates;
  $('#sRevenue').textContent = d.stats.revenue.toLocaleString('th-TH');
  $('#sAvg').textContent = d.stats.orders ? Math.round(d.stats.revenue / d.stats.orders).toLocaleString('th-TH') : 0;

  // ต้องเตรียม
  const ic = d.stats.itemCount;
  const max = Math.max(1, ...d.menu.map(i => ic[i.name] || 0));
  $('#cook').innerHTML = d.menu.length ? d.menu.map(i => {
    const n = ic[i.name] || 0;
    return `<div class="ln"><span class="name">${esc(i.name)}</span><span class="bar"><i style="width:${Math.round(n / max * 100)}%"></i></span><span class="n">${n}</span></div>`;
  }).join('') : '<div class="muted">ยังไม่มีเมนู</div>';
  const pk = d.stats.packs || {};
  $('#pPlate').textContent = pk['จาน'] || 0;
  $('#pBowl').textContent = pk['ถ้วย'] || 0;

  // เมนู (วันนี้ / พรุ่งนี้)
  const tmr = menuDay === 'tomorrow';
  const mlist = tmr ? (d.tomorrowMenu || []) : d.menu;
  $('#cToday').textContent = d.menu.length;
  $('#cTomorrow').textContent = (d.tomorrowMenu || []).length;
  document.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day === menuDay)));
  $('#dayLabel').innerHTML = `<b>${thaiDay(tmr ? d.tomorrow : d.date)}</b>`;
  $('#dayNote').textContent = tmr ? 'ตั้งล่วงหน้า' : 'ลูกค้าเห็นอยู่ตอนนี้';
  $('#tmrHint').hidden = !tmr;
  $('#copyLast').textContent = tmr ? 'คัดลอกจากวันนี้' : 'ใช้เมนูเมื่อวาน';
  $('#newItem').placeholder = tmr ? 'เพิ่มกับข้าวของพรุ่งนี้' : 'เพิ่มกับข้าว เช่น แกงเขียวหวานไก่';
  $('#menu').innerHTML = mlist.length ? mlist.map(i => `
    <div class="ln ${i.available ? '' : 'out'}">
      <button class="sw sm" role="switch" aria-checked="${i.available}" aria-label="${esc(i.name)} มีขาย" data-avail="${esc(i.name)}" data-to="${!i.available}"></button>
      <span class="name">${esc(i.name)}</span>
      <span class="muted">${i.available ? '' : 'หมด'}</span>
      <button class="icon" data-del="${esc(i.name)}" aria-label="ลบ ${esc(i.name)}">×</button>
    </div>`).join('') : `<div class="muted">${tmr ? 'ยังไม่ได้ตั้งเมนูพรุ่งนี้ เพิ่มด้านบน หรือกด "คัดลอกจากวันนี้"' : 'ยังไม่มีกับข้าววันนี้ เพิ่มด้านบน หรือกด "ใช้เมนูเมื่อวาน"'}</div>`;

  // คิว
  const active = d.orders.filter(o => o.status === 'active');
  $('#cWait').textContent = active.length;
  $('#cAll').textContent = d.orders.length;
  $('#qCount').textContent = active.filter(o => !o.ready).length;
  let list = d.orders.slice();
  if (filter === 'waiting') list = active.sort((a, b) => a.queueNum - b.queueNum);
  $('#orders').innerHTML = list.length ? list.map(o => {
    const isNew = newSet.has(o.orderId), cancelled = o.status === 'cancelled';
    const done = !!o.ready;
    const cls = ['tk', cancelled ? 'cancelled' : done ? 'done' : 'todo', isNew && !done ? 'new' : ''].join(' ');
    const rows = o.plates && o.plates.length ? o.plates.map((p, i) => {
      const bowl = p.pack === 'ถ้วย';
      return `<div class="row"><span class="no">${i + 1}</span><span class="it">${esc((p.items || []).join(', '))}</span><span class="rt"><span class="pk ${bowl ? 'bowl' : 'plate'}">${bowl ? 'ใส่ถ้วย' : 'ใส่จาน'}</span><span class="pr">${p.price}</span></span></div>`;
    }).join('') : `<div class="sum">${esc(o.summary)}</div>`;
    return `
    <article class="${cls}">
      <div class="tk-h">
        <span class="tk-q">${o.queue}</span>
        <span class="tk-meta">${cancelled ? '<span class="chip x">ยกเลิกแล้ว</span>' : done ? '<span class="chip done">✓ ทำแล้ว</span>' : isNew ? '<span class="chip new">ใหม่</span>' : '<span class="chip todo">รอทำ</span>'}<span class="tk-time">${esc(o.createdAt)}</span></span>
      </div>
      <div class="tk-items">${rows}</div>
      ${o.note ? `<div class="note">หมายเหตุ · ${esc(o.note)}</div>` : ''}
      <div class="tk-f">
        <span class="fl"><span class="who">${esc(o.name)}</span><span class="tot">${o.total} ฿</span></span>
        <span class="fa">
        ${cancelled ? `<button class="btn ghost sm" data-act="status" data-id="${o.orderId}" data-val="active">คืนคิว</button>` : `<button class="btn text sm" data-act="status" data-id="${o.orderId}" data-val="cancelled">ยกเลิก</button>`}
        ${cancelled ? '' : done
          ? `<button class="btn undo sm" data-act="ready" data-id="${o.orderId}" data-val="false">ยังไม่เสร็จ</button>`
          : `<button class="btn ready" data-act="ready" data-id="${o.orderId}" data-val="true">ทำแล้ว</button>`}
        </span>
      </div>
    </article>`;
  }).join('') : `<div class="empty">${filter === 'waiting' ? 'ยังไม่มีคิววันนี้' : 'ยังไม่มีออเดอร์วันนี้'}</div>`;
}

/* ---------- actions ---------- */
async function act(fn) {
  try { await fn(); await poll(); } catch (e) { alert(e.message); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.filter) {
    filter = t.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === filter)));
    return render();
  }
  if (t.dataset.act) {
    const id = t.dataset.id, field = t.dataset.act;
    let value = t.dataset.val;
    if (field === 'status' && value === 'cancelled' && !confirm('ยกเลิกออเดอร์นี้?')) return;
    if (field !== 'status') value = value === 'true';
    newSet.delete(id);
    return act(() => post({ action: 'update_order', orderId: id, field, value }));
  }
  if (t.dataset.day) { menuDay = t.dataset.day; return render(); }
  if (t.dataset.avail) return act(() => post({ action: 'set_available', name: t.dataset.avail, available: t.dataset.to === 'true', day: menuDay }));
  if (t.dataset.del) {
    if (!confirm(`ลบ "${t.dataset.del}" ออกจากเมนู${menuDay === 'tomorrow' ? 'พรุ่งนี้' : 'วันนี้'}?`)) return;
    return act(() => post({ action: 'remove_item', name: t.dataset.del, day: menuDay }));
  }
});
$('#addItem').onclick = () => {
  const name = $('#newItem').value.trim();
  if (!name) return;
  act(async () => { await post({ action: 'add_item', name, day: menuDay }); $('#newItem').value = ''; $('#newItem').focus(); });
};
$('#newItem').onkeydown = e => { if (e.key === 'Enter') $('#addItem').click(); };
$('#copyLast').onclick = () => act(() => post({ action: 'copy_last_menu', day: menuDay }));
$('#toggleOpen').onclick = () => act(() => post({ action: 'set_settings', values: { open: !data.settings.open } }));
$('#saveClose').onclick = () => {
  const open_time = $('#openTime').value, close_time = $('#closeTime').value;
  if (!open_time || !close_time) return alert('กรุณาใส่เวลาเริ่มรับและปิดรับ');
  if (open_time >= close_time) return alert('เวลาเริ่มรับต้องก่อนเวลาปิดรับ');
  act(() => post({ action: 'set_settings', values: { open_time, close_time } }));
};

tryLogin();
</script>
