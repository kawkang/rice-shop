<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งข้าวแกง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f3faf6; --surface:#ffffff; --soft:#e8f5ee; --soft2:#f1f8f4; --fg:#2c3a33; --fg2:#4b5c53; --muted:#8fa197; --line:#dcede3; --line2:#c4e0d0;
    --pri:#5fbf92; --pri2:#86d4ae; --pri-ink:#ffffff; --pri-soft:#e0f4ea; --pri-deep:#3a9a6e;
    --mint:#3fb68b; --mint-soft:#e3f6ee; --sky:#5aa6e8; --sky-soft:#e6f2fc; --honey:#f0a63a; --honey-soft:#fff3dc;
    --danger:#e2566b; --danger-soft:#fde8ec;
    --round:"Mali","IBM Plex Sans Thai Looped",system-ui,sans-serif;
    --body:"IBM Plex Sans Thai Looped",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body{background:radial-gradient(90% 40% at 0% 0%,#d9f2e5 0%,transparent 60%),radial-gradient(70% 30% at 100% 0%,#e9f6dc 0%,transparent 60%),var(--bg);background-repeat:no-repeat}
  main{max-width:520px;margin:0 auto;padding:22px 16px calc(124px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
  h1,h2{font-family:var(--round);margin:0;line-height:1.3;font-weight:700}
  button{font:inherit;color:inherit}
  .sub{color:var(--muted);font-size:14px}
  .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;display:inline-block}

  /* hero */
  .hero{display:flex;align-items:center;gap:14px;padding:2px 2px 0}
  .blob{flex:none;width:64px;height:64px;border-radius:24px 28px 22px 30px;background:linear-gradient(145deg,#c9ecd9,#ecf8f1);display:grid;place-items:center;font-size:34px;box-shadow:0 6px 16px rgba(76,170,128,.18);transform:rotate(-4deg)}
  .hero h1{font-size:24px}
  .status{display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:var(--mint-soft);color:var(--mint);border-radius:999px;padding:3px 12px 3px 10px;font-size:13px;font-weight:600}
  .status b{font-family:var(--round);font-weight:600}

  .prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .prices div{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
  .prices .emo{font-size:20px;margin-bottom:2px}
  .prices b{font-family:var(--round);font-size:19px;font-weight:700;line-height:1.2}
  .prices span{font-size:12px;color:var(--muted)}

  /* card */
  .card{background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(60,120,90,.07)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-h h2{font-size:19px;display:flex;align-items:center;gap:8px}
  .card-h h2 .emo{font-size:22px}
  .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-family:var(--round);font-size:14px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
  .count{font-family:var(--round);font-size:14px;color:var(--muted);background:var(--soft2);border-radius:999px;padding:2px 10px}
  .count b{color:var(--pri-deep);font-weight:700}

  .menu{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft2);border:1.5px solid transparent;border-radius:18px;padding:14px 12px 14px 16px;cursor:pointer;transition:all .15s}
  .item .nm{flex:1;font-size:16px;font-weight:500}
  .item .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px dashed var(--line2);display:grid;place-items:center;font-family:var(--round);font-size:14px;font-weight:700;color:transparent;transition:all .15s}
  .item[aria-pressed="true"]{background:var(--pri-soft);border-color:var(--pri2)}
  .item[aria-pressed="true"] .nm{color:var(--pri-deep);font-weight:600}
  .item[aria-pressed="true"] .ck{background:var(--pri);border:2px solid var(--pri);color:#fff;transform:scale(1.05)}
  .item:disabled{cursor:not-allowed;background:#f6f8f7}
  .item:disabled .nm{color:var(--muted);text-decoration:line-through}
  .item .out{font-size:12px;font-weight:600;color:var(--danger);background:var(--danger-soft);border-radius:999px;padding:3px 10px}
  .item.full:not([aria-pressed="true"]){opacity:.45}

  .lbl{font-family:var(--round);font-size:14px;font-weight:600;color:var(--fg2);display:flex;align-items:center;gap:6px}
  .pack{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pack-opt{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg2);cursor:pointer;font-size:15px;font-weight:600}
  .pack-opt .emo{font-size:22px}
  .pack-opt[aria-checked="true"]{border-color:var(--pri2);background:var(--pri-soft);color:var(--pri-deep)}

  .btn{border:0;border-radius:999px;padding:14px 18px;cursor:pointer;font-family:var(--round);font-weight:700;font-size:17px;transition:transform .1s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.97)}
  .btn-pri{background:linear-gradient(180deg,var(--pri2),var(--pri));color:var(--pri-ink);box-shadow:0 6px 16px rgba(76,170,128,.32)}
  .btn-soft{background:var(--pri-soft);color:var(--pri-deep)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}

  .plate{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--soft2)}
  .plate + .plate{margin-top:8px}
  .plate .ico{flex:none;font-size:26px}
  .plate .items{min-width:0;flex:1}
  .plate .items div:first-child{font-weight:500}
  .plate .meta{color:var(--muted);font-size:13px;margin-top:1px}
  .plate .price{font-family:var(--round);font-size:18px;font-weight:700;color:var(--pri-deep);white-space:nowrap}
  .x{background:none;border:0;color:var(--danger);font-size:13px;cursor:pointer;padding:0;font-weight:500}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:12px 0 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .empty .emo{font-size:30px}
  .note{position:relative}
  .note .emo{position:absolute;left:14px;top:12px;font-size:17px}
  textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:18px;padding:11px 14px 11px 42px;resize:none;background:var(--surface);color:var(--fg)}
  textarea::placeholder{color:var(--muted)}
  textarea:focus{outline:none;border-color:var(--pri2)}
  .btn:focus-visible,.item:focus-visible,.pack-opt:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1.5px solid var(--line);border-radius:24px 24px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(60,120,90,.08)}
  .bar-in{max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center}
  .bar .total{flex:1;font-family:var(--round);font-size:24px;font-weight:700;line-height:1.15}
  .bar .total small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
  .bar .btn{padding:13px 24px}

  .notice{background:var(--danger-soft);color:var(--danger);border-radius:18px;padding:12px 14px;font-size:14px;font-weight:500}
  .center{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}

  .bigblob{width:116px;height:116px;border-radius:44px 52px 40px 56px;display:grid;place-items:center;font-size:58px;transform:rotate(-4deg);box-shadow:0 10px 26px rgba(76,170,128,.18)}
  .done{min-height:calc(100vh - 150px);min-height:calc(100dvh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
  .done .bigblob{background:linear-gradient(145deg,#cdeedb,#effaf4);margin-bottom:8px}
  .done h1{font-size:24px}
  .queue{font-family:var(--round);font-size:92px;font-weight:700;line-height:1;color:var(--pri);letter-spacing:.02em;text-shadow:0 4px 0 #d3efe0}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--fg2)}
  .pill b{font-family:var(--round);color:var(--pri-deep)}
  .done .btn{margin-top:14px;min-width:220px}

  .closed{min-height:calc(100vh - 152px);min-height:calc(100dvh - 152px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px 8px}
  .closed .shop{font-family:var(--round);font-size:15px;font-weight:600;color:var(--muted)}
  .closed .bigblob{margin:8px 0 6px}
  .closed h1{font-size:23px;line-height:1.4;max-width:300px}
  .closed .msg{color:var(--fg2);font-size:15px;max-width:300px;white-space:pre-line;line-height:1.65}
  .closed .pill b{color:var(--fg)}
  .closed .btn{margin-top:10px;min-width:200px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main id="app">
  <div class="center" id="loading"><span class="emo" style="font-size:36px">🍚</span><span class="sub">กำลังโหลดเมนู…</span></div>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="total"><small id="barInfo">ยังไม่มีจานในตะกร้า</small><span id="barTotal">0 ฿</span></div>
    <button class="btn btn-pri" id="submitBtn" disabled>ยืนยันสั่ง</button>
  </div>
</div>

<script>
/* ========= ตั้งค่า (แก้ 2 บรรทัดนี้) ========= */
const LIFF_ID = '2012577415-QqjJKuHE';                                   // จาก LINE Developers > LINE Login channel > LIFF
const API_URL = 'https://script.google.com/macros/s/AKfycbzeV2BKTBtf2oo3-ehgaQZREoKTUtzRsEWGoQs6w_TgbENirfjxNXXKWnaZmt65moAB/exec'; // Web app URL ของ Apps Script
/* ============================================ */

const state = { menu: null, current: { items: [], pack: 'จาน' }, cart: [], note: '' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emo = (e) => `<span class="emo" aria-hidden="true">${e}</span>`;


function platePrice(p) {
  const n = p.items.length;
  if (n < 1 || n > state.menu.maxItems) return 0;
  return state.menu.prices.base + state.menu.prices.step * (n - 1);
}
const cartTotal = () => state.cart.reduce((s, p) => s + platePrice(p), 0);

async function api(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}

async function boot() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const res = await fetch(API_URL + '?action=menu');
    state.menu = await res.json();
    if (!state.menu.ok) throw new Error(state.menu.error);
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="notice">😵 โหลดไม่สำเร็จ: ${esc(e.message || e)}<br>ลองปิดแล้วเปิดใหม่อีกครั้ง</div>`;
  }
}

function closedView(m) {
  const r = m.closedReason || '';
  const open = m.openTime ? `${m.openTime} น.` : '';
  let v;
  if (r.includes('ของวันนี้แล้ว')) v = { e: '😴', bg: 'linear-gradient(145deg,#dcdcff,#f1efff)', title: 'ปิดรับออเดอร์ของวันนี้แล้ว', msg: `ขอบคุณที่อุดหนุนนะ 💛${open ? `\nพรุ่งนี้เปิดรับตั้งแต่ ${open}` : ''}` };
  else if (r.includes('ยังไม่เปิด')) v = { e: '🌤️', bg: 'linear-gradient(145deg,#ffe6b3,#fff6e0)', title: 'ยังไม่ถึงเวลาเปิดรับออเดอร์', msg: open ? `วันนี้เริ่มรับออเดอร์ ${open}\nแวะกลับมาอีกครั้งนะ` : 'แวะกลับมาอีกครั้งนะ' };
  else if (r.includes('ชั่วคราว')) v = { e: '🙏', bg: 'linear-gradient(145deg,#ffd6dc,#fff0f2)', title: 'ร้านปิดรับออเดอร์ชั่วคราว', msg: 'ขออภัยในความไม่สะดวก\nลองกลับมาสั่งใหม่ภายหลังนะ' };
  else if (r.includes('เมนู')) v = { e: '🧑‍🍳', bg: 'linear-gradient(145deg,#d3f1e4,#effaf5)', title: 'ยังไม่มีเมนูของวันนี้', msg: 'ร้านกำลังเตรียมกับข้าวอยู่\nลองกลับมาใหม่อีกสักครู่นะ' };
  else v = { e: '⏰', bg: 'linear-gradient(145deg,#c9ecd9,#ecf8f1)', title: r.replace(/\s*\(.*\)\s*$/, '') || 'ตอนนี้ยังไม่เปิดรับออเดอร์', msg: 'ลองกลับมาใหม่อีกครั้งภายหลังนะ' };
  const inLine = window.liff && liff.isInClient && liff.isInClient();
  return `
    <section class="closed">
      <div class="shop">${emo('🍚')} ${esc(m.shopName)}</div>
      <div class="bigblob" style="background:${v.bg}">${emo(v.e)}</div>
      <h1>${esc(v.title)}</h1>
      <p class="msg" style="margin:0">${esc(v.msg)}</p>
      ${m.openTime && m.closeTime ? `<div class="pill">${emo('⏰')} รับออเดอร์ทุกวัน <b>${esc(m.openTime)}–${esc(m.closeTime)} น.</b></div>` : ''}
      ${inLine ? '<button class="btn btn-soft" onclick="liff.closeWindow()">ปิดหน้านี้</button>' : ''}
    </section>`;
}

function render() {
  const m = state.menu;
  const bar = $('#bar');
  if (!m.open) {
    bar.hidden = true;
    $('#app').innerHTML = closedView(m);
    return;
  }
  const cur = state.current;
  const max = m.maxItems;
  const full = cur.items.length >= max;
  const list = m.items.map(i => {
    const idx = cur.items.indexOf(i.name), on = idx >= 0;
    return `<button class="item ${full && !on ? 'full' : ''}" data-item="${esc(i.name)}" aria-pressed="${on}" ${i.available ? '' : 'disabled'}>
      <span class="nm">${esc(i.name)}</span>${i.available ? `<span class="ck">${on ? idx + 1 : ''}</span>` : '<span class="out">หมดแล้ว</span>'}</button>`;
  }).join('');
  const curPrice = platePrice(cur);
  const cartHtml = state.cart.length ? state.cart.map((p, idx) => `
      <div class="plate">
        <span class="ico emo">${p.pack === 'ถ้วย' ? '🥣' : '🍛'}</span>
        <div class="items">
          <div>${idx + 1}. ${esc(p.items.join(', '))}</div>
          <div class="meta">${p.items.length} อย่าง · ใส่${esc(p.pack)} · <button class="x" data-remove="${idx}">ลบ</button></div>
        </div>
        <div class="price">${platePrice(p)} ฿</div>
      </div>`).join('') : `<div class="empty">${emo('🥺')}ยังไม่มีรายการ เลือกกับข้าวด้านบนได้เลย</div>`;

  $('#app').innerHTML = `
    <header class="hero">
      <div class="blob">${emo('🍛')}</div>
      <div>
        <h1>${esc(m.shopName)}</h1>
        <span class="status">${emo('🟢')} เปิดรับออเดอร์ ${m.openTime ? `<b>${esc(m.openTime)}</b>–` : 'ถึง '}<b>${esc(m.closeTime)}</b> น.</span>
      </div>
    </header>
    <div class="prices">
      <div>${emo('🍚')}<b>${m.prices.base} ฿</b><span>เริ่มต้น 1 อย่าง</span></div>
      <div>${emo('➕')}<b>${m.prices.step} ฿</b><span>ต่ออย่างที่เพิ่ม</span></div>
      <div>${emo('🥢')}<b>${max} อย่าง</b><span>สูงสุดต่อรายการ</span></div>
    </div>
    <section class="card">
      <div class="card-h"><h2><span class="no">${state.cart.length + 1}</span>เลือกกับข้าว ${emo('😋')}</h2><span class="count"><b>${cur.items.length}</b> / ${max}</span></div>
      <div class="menu">${list}</div>
      <div class="lbl">${emo('🍽️')} ใส่อะไรดี</div>
      <div class="pack" role="radiogroup" aria-label="ใส่ภาชนะ">
        ${['จาน', 'ถ้วย'].map(k => `<button class="pack-opt" role="radio" data-pack="${k}" aria-checked="${cur.pack === k}">${emo(k === 'จาน' ? '🍛' : '🥣')}ใส่${k}</button>`).join('')}
      </div>
      <button class="btn btn-soft" id="addPlate" ${cur.items.length ? '' : 'disabled'}>
        ${cur.items.length ? `${emo('🧺')} ใส่ตะกร้า · ${curPrice} ฿` : 'เลือกกับข้าวอย่างน้อย 1 อย่าง'}
      </button>
    </section>
    <section class="card">
      <div class="card-h"><h2>${emo('🧺')} ตะกร้าของฉัน</h2><span class="count">${state.cart.length} รายการ</span></div>
      <div>${cartHtml}</div>
      <div class="note">${emo('📝')}<textarea id="note" rows="1" maxlength="100" placeholder="หมายเหตุ เช่น ไม่เผ็ด แยกน้ำแกง">${esc(state.note)}</textarea></div>
    </section>`;

  bar.hidden = false;
  $('#barInfo').textContent = state.cart.length ? `🧾 ${state.cart.length} รายการ · จ่ายตอนรับข้าว` : 'ยังไม่มีรายการในตะกร้า';
  $('#barTotal').textContent = cartTotal() + ' ฿';
  $('#submitBtn').disabled = !state.cart.length;
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-item]');
  if (chip && !chip.disabled) {
    const name = chip.dataset.item, items = state.current.items;
    if (items.includes(name)) items.splice(items.indexOf(name), 1);
    else if (items.length < state.menu.maxItems) items.push(name);
    return render();
  }
  const pk = e.target.closest('[data-pack]');
  if (pk) { state.current.pack = pk.dataset.pack; return render(); }
  const rm = e.target.closest('[data-remove]');
  if (rm) { state.cart.splice(Number(rm.dataset.remove), 1); return render(); }
  if (e.target.closest('#addPlate')) {
    if (state.cart.length >= state.menu.maxPlates) return alertBox(`สั่งได้สูงสุด ${state.menu.maxPlates} จานต่อออเดอร์`);
    state.cart.push({ items: [...state.current.items], pack: state.current.pack });
    state.current = { items: [], pack: state.current.pack };
    return render();
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'note') state.note = e.target.value; });

function alertBox(msg) {
  const box = document.createElement('div');
  box.className = 'notice';
  box.textContent = '⚠️ ' + msg;
  $('#app').prepend(box);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => box.remove(), 4000);
}

$('#submitBtn').addEventListener('click', async () => {
  const btn = $('#submitBtn');
  btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  try {
    const res = await api({ action: 'order', idToken: liff.getIDToken(), plates: state.cart, note: state.note });
    if (!res.ok) throw new Error(res.error);
    // ส่งข้อความเข้าแชท → บอทตอบเลขคิวกลับ (reply ฟรี) และแอดมินเห็นในแชท
    if (liff.isInClient()) {
      try {
        await liff.sendMessages([{ type: 'text', text: `ยืนยันออเดอร์ #${res.code}\n${res.summary}\nรวม ${res.total} บาท` }]);
      } catch (_) { /* ส่งเข้าแชทไม่ได้ก็ไม่เป็นไร ออเดอร์บันทึกแล้ว */ }
    }
    showDone(res);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'ยืนยันสั่ง';
    alertBox(e.message || 'สั่งไม่สำเร็จ ลองใหม่อีกครั้ง');
    // เมนูอาจเปลี่ยน (ของหมด) โหลดใหม่
    try { state.menu = await (await fetch(API_URL + '?action=menu')).json(); render(); } catch (_) {}
  }
});

function showDone(res) {
  $('#bar').hidden = true;
  $('#app').innerHTML = `
    <section class="done">
      <div class="bigblob">${emo('🎉')}</div>
      <h1>รับออเดอร์แล้ว!</h1>
      <div class="sub">เลขคิวของคุณคือ</div>
      <div class="queue">${esc(res.queue)}</div>
      <div class="pill">${emo('💰')} ยอดรวม <b>${res.total} ฿</b> · จ่ายตอนรับข้าว</div>
      <span class="sub">${emo('🙋')} แสดงเลขคิวนี้ตอนมารับนะ</span>
      <button class="btn btn-pri" id="closeBtn">${emo('💬')} กลับไปที่แชท</button>
    </section>`;
  $('#closeBtn').addEventListener('click', () => liff.isInClient() ? liff.closeWindow() : location.reload());
}

boot();
</script>
</body>
</html>
