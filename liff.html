<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งข้าวแกง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f4f7f5; --surface:#fff; --fg:#17231d; --muted:#65756c; --line:#dde5df;
    --accent:#138a55; --accent-ink:#fff; --accent-soft:#e2f3ea;
    --egg:#c98a00; --egg-soft:#fdf3d7; --danger:#b23a48; --danger-soft:#f8e5e7;
    --display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
    --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
  main{max-width:520px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
  h1,h2{font-family:var(--display);margin:0;line-height:1.3}
  h1{font-size:22px}
  h2{font-size:17px}
  .sub{color:var(--muted);font-size:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .prices{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
  .prices span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip:disabled{color:var(--muted);text-decoration:line-through;cursor:not-allowed;opacity:.7}
  .chip:not([aria-pressed="true"]):not(:disabled).full{opacity:.45}
  .pack{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pack-opt{font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
  .pack-opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .plate{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
  .plate:last-child{border-bottom:0}
  .plate .items{min-width:0;flex:1}
  .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  h2.cur{display:flex;align-items:center;gap:8px}
  .plate .meta{color:var(--muted);font-size:13px}
  .plate .price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .x{background:none;border:0;color:var(--danger);font:inherit;font-size:13px;cursor:pointer;padding:0}
  textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;background:var(--surface);color:var(--fg)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .bar-in{max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center}
  .bar .total{flex:1;font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar .total small{display:block;font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
  .notice{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px}
  .center{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .queue{font-family:var(--display);font-size:72px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:14px}
  .closed{min-height:calc(100vh - 152px);min-height:calc(100dvh - 152px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px 8px}
  .closed .shop{font-family:var(--display);font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.01em}
  .closed .ic{position:relative;width:112px;height:112px;border-radius:50%;background:var(--surface);background:color-mix(in srgb,var(--tone) 9%,var(--surface));border:1px solid var(--line);display:grid;place-items:center;margin:6px 0 4px;box-shadow:0 10px 30px rgba(23,35,29,.08)}
  .closed .ic::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px dashed var(--line)}
  .closed .ic svg{width:52px;height:52px;color:var(--tone,var(--accent))}
  .closed h1{font-size:24px;line-height:1.35;max-width:300px}
  .closed .msg{color:var(--muted);font-size:15px;max-width:300px;white-space:pre-line;line-height:1.6}
  .closed .hours{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-variant-numeric:tabular-nums;margin-top:4px}
  .closed .hours svg{width:16px;height:16px;color:var(--accent)}
  .closed .hours b{font-family:var(--display);font-weight:600}
  .closed .btn{margin-top:10px;min-width:180px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main id="app">
  <div class="center" id="loading"><span class="sub">กำลังโหลดเมนู…</span></div>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="total"><small id="barInfo">ยังไม่มีจานในตะกร้า</small><span id="barTotal">0 ฿</span></div>
    <button class="btn btn-primary" id="submitBtn" disabled>ยืนยันสั่ง</button>
  </div>
</div>

<script>
/* ========= ตั้งค่า (แก้ 2 บรรทัดนี้) ========= */
const LIFF_ID = '2012577415-QqjJKuHE';                                   // จาก LINE Developers > LINE Login channel > LIFF
const API_URL = 'https://script.google.com/macros/s/AKfycbzeV2BKTBtf2oo3-ehgaQZREoKTUtzRsEWGoQs6w_TgbENirfjxNXXKWnaZmt65moAB/exec'; // Web app URL ของ Apps Script
/* ============================================ */

const state = { menu: null, current: { items: [], pack: 'จาน' }, cart: [], note: '' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function platePrice(p) {
  const n = p.items.length;
  if (n < 1 || n > state.menu.maxItems) return 0;
  return state.menu.prices.base + state.menu.prices.step * (n - 1);
}
const cartTotal = () => state.cart.reduce((s, p) => s + platePrice(p), 0);

async function api(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}

async function boot() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const res = await fetch(API_URL + '?action=menu');
    state.menu = await res.json();
    if (!state.menu.ok) throw new Error(state.menu.error);
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="notice">โหลดไม่สำเร็จ: ${esc(e.message || e)}<br>ลองปิดแล้วเปิดใหม่อีกครั้ง</div>`;
  }
}

const ICONS = {
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><path d="M16 3.5v2M15 4.5h2M19.5 8v1.5M18.75 8.75h1.5"/>',
  sun: '<path d="M12 3v2M5.6 5.6 7 7M3 12h2M19 12h2M17 7l1.4-1.4"/><path d="M7 16a5 5 0 0 1 10 0"/><path d="M3 20h18"/>',
  pause: '<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
  bowl: '<path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/><path d="M9 20h6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;

function closedView(m) {
  const r = m.closedReason || '';
  const open = m.openTime ? `${m.openTime} น.` : '';
  let v;
  if (r.includes('ของวันนี้แล้ว')) v = { icon: 'moon', tone: '#4f5bd5', title: 'ปิดรับออเดอร์ของวันนี้แล้ว', msg: `ขอบคุณที่อุดหนุน${open ? `\nพรุ่งนี้เปิดรับตั้งแต่ ${open}` : ''}` };
  else if (r.includes('ยังไม่เปิด')) v = { icon: 'sun', tone: '#d98a00', title: 'ยังไม่ถึงเวลาเปิดรับออเดอร์', msg: open ? `วันนี้เริ่มรับออเดอร์ ${open}\nแวะกลับมาอีกครั้งนะ` : 'แวะกลับมาอีกครั้งนะ' };
  else if (r.includes('ชั่วคราว')) v = { icon: 'pause', tone: '#b23a48', title: 'ร้านปิดรับออเดอร์ชั่วคราว', msg: 'ขออภัยในความไม่สะดวก\nลองกลับมาสั่งใหม่ภายหลัง' };
  else if (r.includes('เมนู')) v = { icon: 'bowl', tone: 'var(--accent)', title: 'ยังไม่มีเมนูของวันนี้', msg: 'ร้านกำลังเตรียมกับข้าว\nลองกลับมาใหม่อีกสักครู่' };
  else v = { icon: 'clock', tone: 'var(--accent)', title: r.replace(/\s*\(.*\)\s*$/, '') || 'ตอนนี้ยังไม่เปิดรับออเดอร์', msg: 'ลองกลับมาใหม่อีกครั้งภายหลัง' };
  const inLine = window.liff && liff.isInClient && liff.isInClient();
  return `
    <section class="closed" style="--tone:${v.tone}">
      <div class="shop">${esc(m.shopName)}</div>
      <div class="ic">${svg(v.icon)}</div>
      <h1>${esc(v.title)}</h1>
      <p class="msg" style="margin:0">${esc(v.msg)}</p>
      ${m.openTime && m.closeTime ? `<div class="hours">${svg('clock')}รับออเดอร์ทุกวัน <b>${esc(m.openTime)}–${esc(m.closeTime)} น.</b></div>` : ''}
      ${inLine ? '<button class="btn btn-ghost" onclick="liff.closeWindow()">ปิดหน้านี้</button>' : ''}
    </section>`;
}

function render() {
  const m = state.menu;
  const bar = $('#bar');
  if (!m.open) {
    bar.hidden = true;
    $('#app').innerHTML = closedView(m);
    return;
  }
  const cur = state.current;
  const max = m.maxItems;
  const full = cur.items.length >= max;
  const chips = m.items.map(i => {
    const on = cur.items.includes(i.name);
    return `<button class="chip ${full && !on ? 'full' : ''}" data-item="${esc(i.name)}" aria-pressed="${on}" ${i.available ? '' : 'disabled'}>${esc(i.name)}${i.available ? '' : ' (หมด)'}</button>`;
  }).join('');
  const curPrice = platePrice(cur);
  const cartHtml = state.cart.length ? state.cart.map((p, idx) => `
      <div class="plate">
        <span class="no">${idx + 1}</span>
        <div class="items">
          <div>${esc(p.items.join(', '))}</div>
          <div class="meta">${p.items.length} อย่าง · ใส่${esc(p.pack)} · <button class="x" data-remove="${idx}">ลบ</button></div>
        </div>
        <div class="price">${platePrice(p)} ฿</div>
      </div>`).join('') : '<div class="empty">ยังไม่มีรายการ เลือกกับข้าวด้านบนแล้วกด "ใส่ตะกร้า"</div>';

  $('#app').innerHTML = `
    <header>
      <h1>${esc(m.shopName)}</h1>
      <div class="sub">กับข้าววันนี้ · รับออเดอร์ ${m.openTime ? esc(m.openTime) + '–' : 'ถึง '}${esc(m.closeTime)} น.</div>
    </header>
    <div class="prices">
      <span>จานละ ${m.prices.base} ฿ (1 อย่าง)</span><span>เพิ่มอย่างละ ${m.prices.step} ฿</span><span>สูงสุด ${max} อย่าง</span>
    </div>
    <section class="card">
      <div class="row"><h2 class="cur"><span class="no">${state.cart.length + 1}</span>เลือกกับข้าว</h2><span class="sub">เลือกแล้ว ${cur.items.length}/${max}</span></div>
      <div class="chips">${chips}</div>
      <div class="pack" role="radiogroup" aria-label="ใส่ภาชนะ">
        ${['จาน', 'ถ้วย'].map(k => `<button class="pack-opt" role="radio" data-pack="${k}" aria-checked="${cur.pack === k}">${k === 'จาน' ? '🍽️' : '🥣'} ใส่${k}</button>`).join('')}
      </div>
      <button class="btn btn-ghost" id="addPlate" ${cur.items.length ? '' : 'disabled'}>
        ${cur.items.length ? `ใส่ตะกร้า · ${curPrice} ฿` : 'เลือกกับข้าวอย่างน้อย 1 อย่าง'}
      </button>
    </section>
    <section class="card">
      <h2>ตะกร้า</h2>
      <div>${cartHtml}</div>
      <textarea id="note" rows="2" maxlength="100" placeholder="หมายเหตุ เช่น ไม่เผ็ด แยกน้ำแกง">${esc(state.note)}</textarea>
    </section>`;

  bar.hidden = false;
  $('#barInfo').textContent = state.cart.length ? `${state.cart.length} รายการ · จ่ายตอนรับข้าว` : 'ยังไม่มีรายการในตะกร้า';
  $('#barTotal').textContent = cartTotal() + ' ฿';
  $('#submitBtn').disabled = !state.cart.length;
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-item]');
  if (chip && !chip.disabled) {
    const name = chip.dataset.item, items = state.current.items;
    if (items.includes(name)) items.splice(items.indexOf(name), 1);
    else if (items.length < state.menu.maxItems) items.push(name);
    return render();
  }
  const pk = e.target.closest('[data-pack]');
  if (pk) { state.current.pack = pk.dataset.pack; return render(); }
  const rm = e.target.closest('[data-remove]');
  if (rm) { state.cart.splice(Number(rm.dataset.remove), 1); return render(); }
  if (e.target.closest('#addPlate')) {
    if (state.cart.length >= state.menu.maxPlates) return alertBox(`สั่งได้สูงสุด ${state.menu.maxPlates} จานต่อออเดอร์`);
    state.cart.push({ items: [...state.current.items], pack: state.current.pack });
    state.current = { items: [], pack: state.current.pack };
    return render();
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'note') state.note = e.target.value; });

function alertBox(msg) {
  const box = document.createElement('div');
  box.className = 'notice';
  box.textContent = msg;
  $('#app').prepend(box);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => box.remove(), 4000);
}

$('#submitBtn').addEventListener('click', async () => {
  const btn = $('#submitBtn');
  btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  try {
    const res = await api({ action: 'order', idToken: liff.getIDToken(), plates: state.cart, note: state.note });
    if (!res.ok) throw new Error(res.error);
    // ส่งข้อความเข้าแชท → บอทตอบเลขคิวกลับ (reply ฟรี) และแอดมินเห็นในแชท
    if (liff.isInClient()) {
      try {
        await liff.sendMessages([{ type: 'text', text: `ยืนยันออเดอร์ #${res.code}\n${res.summary}\nรวม ${res.total} บาท` }]);
      } catch (_) { /* ส่งเข้าแชทไม่ได้ก็ไม่เป็นไร ออเดอร์บันทึกแล้ว */ }
    }
    showDone(res);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'ยืนยันสั่ง';
    alertBox(e.message || 'สั่งไม่สำเร็จ ลองใหม่อีกครั้ง');
    // เมนูอาจเปลี่ยน (ของหมด) โหลดใหม่
    try { state.menu = await (await fetch(API_URL + '?action=menu')).json(); render(); } catch (_) {}
  }
});

function showDone(res) {
  $('#bar').hidden = true;
  $('#app').innerHTML = `
    <div class="center">
      <span class="sub">รับออเดอร์แล้ว ✓</span>
      <span>เลขคิวของคุณ</span>
      <div class="queue">${esc(res.queue)}</div>
      <span class="sub">ยอดรวม ${res.total} บาท · จ่ายตอนรับข้าว</span>
      <span class="sub">แสดงเลขคิวนี้ตอนมารับ</span>
      <button class="btn btn-primary" id="closeBtn" style="margin-top:12px">กลับไปที่แชท</button>
    </div>`;
  $('#closeBtn').addEventListener('click', () => liff.isInClient() ? liff.closeWindow() : location.reload());
}

boot();
</script>
</body>
</html>
